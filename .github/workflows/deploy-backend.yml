name: Deploy Backend

# Deploys the Spring Boot backend to Railway after CI passes (CLAUDE.md branch mapping):
#   - push to main    → GitHub environment "production" → Railway production environment
#   - push to develop → GitHub environment "staging"    → Railway staging environment
# The image is built by Railway from backend/Dockerfile (config in backend/railway.toml, which
# also sets the /actuator/health health check, so a failing release never receives traffic).
#
# Per GitHub environment:
#   secret   RAILWAY_TOKEN      — a Railway *project token* scoped to that Railway environment
#   variable RAILWAY_SERVICE    — the backend service name in Railway
#   variable BACKEND_HEALTH_URL — optional, e.g. https://api.example.com/actuator/health
# Runtime variables (SPRING_PROFILES_ACTIVE=prod|staging, JWT_SECRET, DB_URL, …; see
# docs/TECH_STACK_ADDITIONS.md §24) are set on the Railway service, not here.
#
# If the Railway service is instead connected to this repo with Railway's GitHub integration
# ("Wait for CI" enabled), leave RAILWAY_TOKEN unset so this workflow is a no-op.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploys are opt-in: nothing ships until the repository variable DEPLOYMENTS_ENABLED is "true"
    if: >-
      vars.DEPLOYMENTS_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'staging' }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - name: Check deploy configuration
        id: cfg
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE" ]; then
            echo "::warning::Railway deploy is not configured (RAILWAY_TOKEN secret, RAILWAY_SERVICE variable); skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version: '20'

      - name: Install Railway CLI
        if: steps.cfg.outputs.enabled == 'true'
        run: npm install -g @railway/cli@4

      - name: Deploy to Railway
        if: steps.cfg.outputs.enabled == 'true'
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        # --ci streams the build logs and fails the job if the build or deploy fails
        run: railway up --ci --service "$RAILWAY_SERVICE"

      - name: Smoke check
        if: steps.cfg.outputs.enabled == 'true' && vars.BACKEND_HEALTH_URL != ''
        env:
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$HEALTH_URL" | grep -q '"status":"UP"'; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend health ($i/20)..."
            sleep 15
          done
          echo "::error::Backend did not report UP at $HEALTH_URL"
          exit 1

      - name: Summary
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          {
            echo "### Backend deployed to Railway (${DEPLOY_BRANCH})"
            echo "- Commit: \`${DEPLOY_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
