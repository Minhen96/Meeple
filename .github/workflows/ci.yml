name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: meeple_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: local
      RESEND_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build
      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html
          if-no-files-found: warn
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET
          path = "build/reports/jacoco/test/jacocoTestReport.xml"
          if not os.path.exists(path):
              print("No JaCoCo report generated.")
          else:
              root = ET.parse(path).getroot()
              line = next(c for c in root.findall("counter") if c.get("type") == "LINE")
              covered, missed = int(line.get("covered")), int(line.get("missed"))
              pct = 100.0 * covered / max(covered + missed, 1)
              print(f"### Backend line coverage: {pct:.1f}% ({covered}/{covered + missed} lines)")
          EOF

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run check
      - name: Lint
        run: pnpm run lint
      - name: Unit tests
        run: pnpm run test:unit
      - name: Build
        run: pnpm run build
