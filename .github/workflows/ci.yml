name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: meeple_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: local
      RESEND_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build
      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html
          if-no-files-found: warn
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET
          path = "build/reports/jacoco/test/jacocoTestReport.xml"
          if not os.path.exists(path):
              print("No JaCoCo report generated.")
          else:
              root = ET.parse(path).getroot()
              line = next(c for c in root.findall("counter") if c.get("type") == "LINE")
              covered, missed = int(line.get("covered")), int(line.get("missed"))
              pct = 100.0 * covered / max(covered + missed, 1)
              print(f"### Backend line coverage: {pct:.1f}% ({covered}/{covered + missed} lines)")
          EOF

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run check
      - name: Lint
        run: pnpm run lint
      - name: Unit tests with coverage
        run: pnpm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const path = 'coverage/coverage-summary.json';
          if (!fs.existsSync(path)) {
            console.log('No frontend coverage report generated.');
          } else {
            const { total } = JSON.parse(fs.readFileSync(path, 'utf8'));
            console.log('### Frontend coverage (TypeScript modules)');
            console.log('| Metric | Covered | Total | % |');
            console.log('|---|---|---|---|');
            for (const key of ['lines', 'branches', 'functions', 'statements']) {
              const m = total[key];
              console.log(`| ${key} | ${m.covered} | ${m.total} | ${m.pct}% |`);
            }
          }
          EOF
      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage
          if-no-files-found: warn
      - name: Build
        run: pnpm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      # lib/firebase_options.dart comes from `flutterfire configure` with the project's Firebase
      # credentials and is not committed. CI only needs it to compile, so write an inert stub
      # when it is absent (never overwrites a real one).
      - name: Stub firebase_options.dart if absent
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            cat > lib/firebase_options.dart <<'DART'
          // CI stub: generated by .github/workflows/ci.yml, never shipped.
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
                  apiKey: 'ci',
                  appId: 'ci',
                  messagingSenderId: 'ci',
                  projectId: 'ci',
                );
          }
          DART
          fi
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test with coverage
        run: flutter test --coverage
      # Gate on lib/ line coverage, excluding generated code (build_runner, gen-l10n)
      - name: Enforce coverage threshold
        run: |
          python3 - <<'PY'
          import os, re, sys
          generated = re.compile(r'(\.g\.dart|\.freezed\.dart)$|/l10n/gen/')
          hit = total = 0
          current = None
          for line in open('coverage/lcov.info'):
              if line.startswith('SF:'):
                  current = line[3:].strip()
              elif line.startswith('DA:') and current and not generated.search(current):
                  total += 1
                  hit += int(line.strip().split(',')[1]) > 0
          pct = 100.0 * hit / total if total else 0.0
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"Mobile line coverage (excluding generated): {pct:.1f}% ({hit}/{total})\n")
          print(f"Mobile line coverage: {pct:.1f}%")
          sys.exit(0 if pct >= 80.0 else 1)
          PY
