name: meeple_hearth
description: A board game community and recording app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # HTTP client
  dio: ^5.7.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Local DB
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # WebSocket / STOMP
  stomp_dart_client: ^0.4.4

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Media
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  image_cropper: ^8.0.2
  cached_network_image: ^3.4.1
  share_plus: ^10.0.0
  file_picker: ^8.1.2

  # UI / UX
  flutter_animate: ^4.5.0
  infinite_scroll_pagination: ^4.1.0
  table_calendar: ^3.1.2
  omni_datetime_picker: ^2.0.3
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Device / Platform
  connectivity_plus: ^6.0.5
  app_links: ^6.1.1
  local_auth: ^2.3.0
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Monitoring
  sentry_flutter: ^8.9.0
  posthog_flutter: ^4.2.0

  # Misc
  intl: ^0.20.0
  equatable: ^2.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  # isar_generator is intentionally excluded — it pins analyzer <6.0.0 which
  # conflicts with modern tooling. Run Isar code generation in isolation:
  #   dart pub global activate isar_generator 3.1.0+1
  #   dart run isar_generator build

  # Linting
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
