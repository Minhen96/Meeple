# No default profile: run with SPRING_PROFILES_ACTIVE=local | staging | prod.
# Without one, no datasource or JWT secret is configured and startup fails fast.
server:
  # Resolve the client IP from X-Forwarded-For via Tomcat's RemoteIpValve, which only trusts
  # entries appended by internal (private-network) proxies, so clients cannot spoof their IP.
  forward-headers-strategy: native
  # Finish in-flight requests before stopping (ENGINEERING_STANDARDS section 12)
  shutdown: graceful

spring:
  application:
    name: meeple-backend
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    lazy-initialization: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  datasource:
    hikari:
      max-lifetime: 240000        # 4 min — below Neon's 5 min idle timeout
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Spring Cache backed by Redis (see config/CacheConfig). No cache is used until a
  # package annotates a method with @Cacheable; per-cache TTLs are set in CacheConfig.
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      key-prefix: "cache:"
      use-key-prefix: true

  mail:
    host: smtp.resend.com
    port: 465
    username: resend
    password: ${RESEND_API_KEY}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

app:
  seed:
    csv-url: ${SEED_CSV_URL:}
  # Global API rate limits per one-minute window (FEATURES_COMPLETE section 12.6)
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    per-user-per-minute: 200
    per-ip-per-minute: 60
    login-per-minute: 10
    availability-per-minute: 60
  # iOS universal links / Android App Links (/.well-known). Empty: files list no apps.
  deep-links:
    ios-app-id: ${IOS_APP_ID:}
    android-package: ${ANDROID_PACKAGE_NAME:}
    android-sha256-fingerprints: ${ANDROID_SHA256_FINGERPRINTS:}
  fcm:
    # Firebase service-account JSON (raw or base64, see TECH_STACK_ADDITIONS section 24).
    # Empty disables push (no-op sender).
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  bgg:
    # Registered BGG application token, required by xmlapi2/collection. Empty: import returns
    # 503 BGG_API_UNAVAILABLE.
    api-token: ${BGG_API_TOKEN:}
  ai:
    completion:
      base-url: ${AI_COMPLETION_BASE_URL:https://api.openai.com}
      api-key: ${AI_COMPLETION_API_KEY:}
      model: ${AI_COMPLETION_MODEL:gpt-4o-mini}
    embedding:
      base-url: ${AI_EMBEDDING_BASE_URL:https://api.openai.com}
      api-key: ${AI_EMBEDDING_API_KEY:}
      model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}

resilience4j:
  circuitbreaker:
    instances:
      bgg:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      openai:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      fcm:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      # Cloudflare R2 server-side operations (post image key move, FEATURES_COMPLETE 5.2)
      r2:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      r2:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  timelimiter:
    instances:
      bgg:
        timeoutDuration: 8s
      openai:
        timeoutDuration: 30s
      fcm:
        timeoutDuration: 10s

# Sentry error tracking. An empty DSN disables the SDK entirely (local, CI, tests).
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:${spring.profiles.active:local}}
  send-default-pii: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  # Run after the @RestControllerAdvice handlers so handled 4xx ApiExceptions are not reported;
  # unhandled errors reach Sentry through the Logback integration (GlobalExceptionHandler logs them).
  exception-resolver-order: 2147483647
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

logging:
  level:
    root: INFO
    org.apache.pdfbox: ERROR
    org.apache.fontbox: ERROR
    com.meeplehearth: INFO
