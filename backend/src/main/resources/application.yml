spring:
  application:
    name: meeple-backend
  profiles:
    active: local
  main:
    lazy-initialization: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  datasource:
    hikari:
      max-lifetime: 240000        # 4 min — below Neon's 5 min idle timeout
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: smtp.resend.com
    port: 465
    username: resend
    password: ${RESEND_API_KEY}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

app:
  ai:
    completion:
      base-url: ${AI_COMPLETION_BASE_URL:https://api.openai.com}
      api-key: ${AI_COMPLETION_API_KEY:}
      model: ${AI_COMPLETION_MODEL:gpt-4o-mini}
    embedding:
      base-url: ${AI_EMBEDDING_BASE_URL:https://api.openai.com}
      api-key: ${AI_EMBEDDING_API_KEY:}
      model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}

resilience4j:
  circuitbreaker:
    instances:
      bgg:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      openai:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      bgg:
        timeoutDuration: 8s
      openai:
        timeoutDuration: 30s
