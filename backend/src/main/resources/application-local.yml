server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meeple_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  # Work packages merge in any order, so a higher migration may land before a lower one.
  flyway:
    out-of-order: true

  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.ssl.enable: false

  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: false

app:
  security:
    open-admin-endpoints: true
  # Local dev and CI send everything (browser, SSR, tests) from 127.0.0.1: same windows,
  # higher ceilings. Staging and prod use the defaults from application.yml.
  rate-limit:
    per-user-per-minute: 2000
    per-ip-per-minute: 1000
    login-per-minute: 200
  # AI provider — set these in .env.local
  # To use DeepSeek:  AI_COMPLETION_BASE_URL=https://api.deepseek.com  AI_COMPLETION_MODEL=deepseek-chat
  # To use Groq:      AI_COMPLETION_BASE_URL=https://api.groq.com/openai  AI_COMPLETION_MODEL=llama-3.3-70b-versatile
  # Embedding stays on OpenAI (most providers don't offer embedding APIs)
  ai:
    completion:
      api-key: ${AI_COMPLETION_API_KEY:}
    embedding:
      api-key: ${AI_EMBEDDING_API_KEY:}
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-must-be-at-least-256-bits-long-xx}
    access-token-expiry-ms: 900000
    refresh-token-expiry-days: 30
  cors:
    allowed-origins:
      - http://localhost:5173
  r2:
    endpoint: ${R2_ENDPOINT:http://localhost:9000}
    access-key: ${R2_ACCESS_KEY:mock-access-key}
    secret-key: ${R2_SECRET_KEY:mock-secret-key}
    bucket: ${R2_BUCKET:meeple-media}
    private-bucket: ${R2_PRIVATE_BUCKET:}
    public-url: ${R2_PUBLIC_URL:http://localhost:9000/meeple-media}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  email:
    from: ${EMAIL_FROM:noreply@meeple.yapminhen.com}
